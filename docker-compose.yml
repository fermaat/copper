# Copper API service
# Ollama is expected to run on the host (or another external service)
# Configure OLLAMA_BASE_URL in .env to point to it

services:
  copper:
    build: .
    ports:
      - "${COPPER_PORT:-8000}:8000"
    volumes:
      # Bind-mount the host's copperminds so the container shares the same store
      # as the local CLI (~/.copper/minds). Matches launch_container.sh.
      - ${HOME}/.copper/minds:/data/minds
    env_file:
      - .env
    # environment:
      # Override with host.docker.internal if Ollama runs on the host Mac/Windows
      # - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Bind to all interfaces so the host can reach the container via port mapping
    environment:
      - COPPER_HOST=0.0.0.0
      - COPPER_PORT=8000
      - COPPER_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - COPPER_LLM_PROVIDER=ollama
      - COPPER_LLM_MODEL=gemma4-32k:latest
      - COPPER_MINDS_DIR=/data/minds          
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/docs').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
